services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recipebook
      POSTGRES_PASSWORD: recipebook_dev
      POSTGRES_DB: recipebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
  